version: 2

models:
  - name: accounts_payable_details
    description: >
      1:1 thin view of raw_misa.accounts_payable_details with the data_details
      JSONB array unnested into flat columns (one row per array element).
      Grain: 1 row = 1 công nợ phải trả detail line.

  - name: inventory_detail_log
    description: >
      1:1 thin view of raw_misa.inventory_detail_log with the history_details
      JSONB array unnested into flat columns (one row per array element).
      Grain: 1 row = 1 inventory movement history line.

  - name: balance_sheet_monthly
    description: 1:1 thin view of raw_misa.balance_sheet_monthly_fact. Bảng cân đối kế toán — báo cáo tháng.

  - name: balance_sheet_quarterly
    description: 1:1 thin view of raw_misa.balance_sheet_quarterly_fact. Bảng cân đối kế toán — báo cáo quý.

  - name: balance_sheet_yearly
    description: 1:1 thin view of raw_misa.balance_sheet_yearly_fact. Bảng cân đối kế toán — báo cáo năm.

  - name: cash_flow_monthly
    description: 1:1 thin view of raw_misa.cash_flow_monthly_fact. Báo cáo lưu chuyển tiền tệ — tháng.

  - name: cash_flow_quarterly
    description: 1:1 thin view of raw_misa.cash_flow_quarterly_fact. Báo cáo lưu chuyển tiền tệ — quý.

  - name: cash_flow_yearly
    description: 1:1 thin view of raw_misa.cash_flow_yearly_fact. Báo cáo lưu chuyển tiền tệ — năm.

  - name: income_statement_monthly
    description: 1:1 thin view of raw_misa.income_statement_monthly_fact. Báo cáo kết quả kinh doanh — tháng.

  - name: income_statement_quarterly
    description: 1:1 thin view of raw_misa.income_statement_quarterly_fact. Báo cáo kết quả kinh doanh — quý.

  - name: income_statement_yearly
    description: 1:1 thin view of raw_misa.income_statement_yearly_fact. Báo cáo kết quả kinh doanh — năm.

  - name: journal_entries
    description: >
      1:1 thin view of raw_misa.journal_entries with the data_details
      JSONB array unnested into flat columns (one row per array element).
      Grain: 1 row = 1 bút toán chi tiết (journal detail line).

  - name: purchase_vouchers
    description: 1:1 thin view of raw_misa.purchase_vouchers. Phiếu nhập mua hàng — header.

  - name: purchase_voucher_details
    description: 1:1 thin view of raw_misa.purchase_voucher_details. Phiếu nhập mua hàng — line detail.

  - name: sales_detail_report
    description: 1:1 thin view of raw_misa.sales_detail_report. Báo cáo bán hàng chi tiết.

  - name: loan_agreements
    description: 1:1 thin view of raw_misa.loan_agreements. Hợp đồng vay.

  - name: pending_loan_agreements
    description: 1:1 thin view of raw_misa.pending_loan_agreements. Hợp đồng cho vay đang chờ.

  - name: budget_plan
    description: 1:1 thin view of raw_misa.budget_plan. Kế hoạch ngân sách theo năm (cột m01..m12).
