version: 2

models:
  - name: fct_sales_orders
    description: "Retail sales order fact table. Grain: 1 row = 1 valid confirmed order. Excludes draft, test, cancelled, and compensation orders."
    columns:
      - name: order_id
        description: "Primary key — unified sales order ID."
        tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key to dim_sales_customers. Known gap: 96 Haravan-only customers not yet in dim."
      - name: sales_channel
        description: "Sales channel translated to Vietnamese."
      - name: payment_status
        description: "Payment status translated to Vietnamese."
      - name: fulfillment_status
        description: "Fulfillment status translated to Vietnamese."
        tests:
          - accepted_values:
              arguments:
                values:
                  - "Đã giao hàng"
                  - "Chưa giao hàng"
                  - "Chưa xác định"
      - name: processing_status
        description: "Processing status translated to Vietnamese."
      - name: order_customer_type
        description: "Customer type — Khách mới or Khách cũ."
      - name: product_categories
        description: "Comma-separated product category names from ERPNext (e.g. 'Nhẫn Nam, Dây Chuyền'). NULL for Haravan-only orders."
      - name: purchase_purposes
        description: "Comma-separated purchase purpose names from ERPNext (e.g. 'BT - Mua cho bản thân, CH - Cầu hôn'). NULL for Haravan-only orders."
      - name: price_range
        description: "Price range bucket (triệu VND) based on total_price summed across split_order_group."

  - name: fct_sales_order_items
    description: "Order-item-level sales fact. INNER JOINs fct_sales_orders to inherit valid-order filters."
    columns:
      - name: order_item_id
        description: "Primary key for the sales order item."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_sales_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: order_id
      - name: customer_id
        description: "Foreign key to dim_sales_customers inherited from the order. Known gap: 260 items reference customers not yet in dim."
        tests:
          - not_null
      - name: product_key
        description: "Foreign key to dim_sales_products (variant_id). NULL if item has no variant."

  - name: fct_sales_attributions
    description: "Order-level sales attribution — splits order revenue to sales people by ERPNext sales team percentages."
    columns:
      - name: attribution_key
        description: "Primary key — order_id x sales_team_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_sales_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: order_id
      - name: sales_person_key
        description: "Foreign key to dim_sales_persons."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_persons')
                field: sales_person_id

  - name: dim_sales_products
    description: "Variant-grain product dimension from catalog."
    columns:
      - name: product_key
        description: "Primary key — variant ID."
        tests:
          - unique
          - not_null
      - name: diamond_edge_size
        description: "Larger of diamond_edge_size_1 and diamond_edge_size_2, rounded down to 1 decimal (FLOOR)."
      - name: diamond_edge_size_display
        description: "Combined edge sizes as string '4.5 x 5.0' (FLOOR rounded, 1 decimal each). NULL if either is NULL."

  - name: dim_sales_customers
    description: "Customer dimension — profile from CRM enriched with order metrics."
    columns:
      - name: customer_id
        description: "Primary key — unified customer ID."
        tests:
          - unique
          - not_null

  - name: dim_sales_persons
    description: "Sales person dimension with active, presale, region, store, and position fields."
    columns:
      - name: sales_person_id
        description: "Primary key — ERPNext sales person ID."
        tests:
          - unique
          - not_null
      - name: region_name
        description: "Sales region — Miền Bắc / Miền Nam / Miền Tây."
      - name: city_name
        description: "City derived from parent sales person config name parsing (Hà Nội / Hồ Chí Minh / Cần Thơ / National)."

  - name: fct_sales_targets_monthly
    description: "Monthly salesperson target fact."
    columns:
      - name: sales_target_key
        description: "Primary key for monthly salesperson target records."
        tests:
          - unique
          - not_null
      - name: sales_person_key
        description: "Foreign key to dim_sales_persons."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_persons')
                field: sales_person_id

  - name: fct_sales_kpi_daily
    description: "Daily sales KPI — actual vs target per sales person per day with MTD cumulative. Grain: 1 row = 1 sales_person × 1 date."
    columns:
      - name: kpi_daily_key
        description: "Primary key — sales_person_key:date_actual."
        tests:
          - unique
          - not_null
      - name: sales_person_key
        description: "Foreign key to dim_sales_persons."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_persons')
                field: sales_person_id
      - name: date_actual
        description: "Foreign key to dim_sales_dates."
        tests:
          - not_null
      - name: mtd_achievement_gross_pct
        description: "MTD gross revenue / monthly target. NULL when no target."
      - name: month_progress_pct
        description: "Day of month / days in month. Indicates time progress."

  - name: dim_sales_lead_sources
    description: "Lead source dimension — lookup table for lead origination channels (Facebook pages, Zalo, etc.)."
    columns:
      - name: lead_source_id
        description: "Primary key — ERPNext lead source ID."
        tests:
          - unique
          - not_null

  - name: fct_sales_leads
    description: "Lead fact table. Grain: 1 row = 1 lead from ERPNext. Includes conversion metrics, sales person attribution, and source info."
    columns:
      - name: lead_id
        description: "Primary key — ERPNext lead ID."
        tests:
          - unique
          - not_null
      - name: sales_person_key
        description: "Foreign key to dim_sales_persons. NULL if lead is unassigned."
        tests:
          - relationships:
              arguments:
                to: ref('dim_sales_persons')
                field: sales_person_id
      - name: lead_status
        description: "Lead status translated to Vietnamese."
      - name: qualification_status
        description: "Qualification status translated to Vietnamese."
      - name: is_converted
        description: "Boolean flag indicating if the lead was qualified/converted."
        tests:
          - not_null
      - name: budget_lead
        description: "Budget range reference ID (e.g. CRM-LEAD-BUDGET-0005)."
      - name: budget_label
        description: "Budget range label (e.g. > 120 Triệu, 30 - 50 Triệu)."
      - name: budget_from
        description: "Budget range lower bound in VND."
      - name: budget_to
        description: "Budget range upper bound in VND."
      - name: purpose_lead
        description: "Demand/purpose reference ID (e.g. CRM-LEAD-DEMAND-0011)."
      - name: demand_label
        description: "Demand/purpose label (e.g. Mua cầu hôn, Mua cho bản thân)."

  - name: fct_sales_lead_preferred_products
    description: "Bridge table for lead preferred products. Grain: 1 row = 1 lead × 1 preferred product. 1 lead can have many products (1-n)."
    columns:
      - name: preferred_product_id
        description: "Primary key — unique row ID from ERPNext child table."
        tests:
          - unique
          - not_null
      - name: lead_id
        description: "Foreign key to fct_sales_leads."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_leads')
                field: lead_id
      - name: product_type
        description: "Product type reference ID (e.g. CRM-LEAD-PRODUCT-0014)."
      - name: product_label
        description: "Product type label (e.g. Kim cương viên, Nhẫn Nữ, Dây Chuyền)."

  - name: fct_sales_order_product_categories
    description: "Bridge table for order product categories. Grain: 1 row = 1 order × 1 product category. Only includes ERPNext-matched orders."
    columns:
      - name: order_product_category_key
        description: "Primary key — order_id:product_category_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_sales_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: order_id
      - name: product_category_id
        description: "Foreign key to ERPNext Product Category master (e.g. PC08421)."
        tests:
          - not_null
      - name: category_name
        description: "Product category display name (e.g. Nhẫn Nam KCTN Nguyên Chiếc)."

  - name: fct_sales_order_purchase_purposes
    description: "Bridge table for order purchase purposes. Grain: 1 row = 1 order × 1 purchase purpose. Only includes ERPNext-matched orders."
    columns:
      - name: order_purchase_purpose_key
        description: "Primary key — order_id:purchase_purpose_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_sales_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: order_id
      - name: purchase_purpose_id
        description: "Foreign key to ERPNext Purchase Purpose master (e.g. PP08603)."
        tests:
          - not_null
      - name: purpose_name
        description: "Purchase purpose display name (e.g. BT - Mua cho bản thân)."

  - name: rpt_sales_order_attributes_dashboard
    description: "Metabase reporting helper for order-level ERP classifications. Grain: 1 row = 1 order with purchase purposes and product categories aggregated to strings."
    columns:
      - name: order_id
        description: "Primary key — one row per sales order."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: order_id
      - name: product_categories
        description: "Distinct product category names aggregated at order grain."
      - name: purchase_purposes
        description: "Distinct purchase purpose names aggregated at order grain."

  - name: rpt_sales_orders_dashboard
    description: "Metabase order-level reporting model. Grain: 1 row = 1 valid confirmed order enriched with customer and primary sales person dimensions for dashboard filters."
    columns:
      - name: order_id
        description: "Primary key — one row per sales order."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_orders')
                field: order_id
      - name: customer_id
        description: "Foreign key to dim_sales_customers."
      - name: sales_channel
        description: "Order sales channel for dashboard filtering."
      - name: customer_lead_source_name
        description: "Lead source for the order's customer, resolved through customer lead when available and coalesced to Chưa xác định."
      - name: customer_lead_id
        description: "Lead ID linked from the order's customer profile."
      - name: customer_lead_name
        description: "Lead display name linked from the order's customer profile."
      - name: customer_lead_source_platform
        description: "Lead source platform for the order's customer lead."
      - name: customer_pancake_platform
        description: "Pancake platform for the order's customer lead/source."
      - name: customer_lead_order_group_key
        description: "Order group key for lead-level ordering, using split_order_group when available and order_id otherwise."
      - name: customer_lead_order_group_rank
        description: "Rank of this order group within the linked lead's order history. Rank 1 is the first order group."
      - name: customer_lead_order_group_at
        description: "Earliest order timestamp within the lead's order group."
      - name: customer_lead_order_group_date
        description: "Earliest order date within the lead's order group."
      - name: is_customer_lead_first_order_group
        description: "True when the order belongs to the first order group linked to the customer lead."
        tests:
          - not_null
      - name: sales_region_name
        description: "Primary sales person's sales region."

  - name: rpt_sales_person_daily_dashboard
    description: "Metabase sales performance reporting model. Grain: 1 row = 1 sales person × 1 date, enriched with sales person dimensions."
    columns:
      - name: kpi_daily_key
        description: "Primary key — sales_person_key:date_actual."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_kpi_daily')
                field: kpi_daily_key
      - name: sales_person_key
        description: "Foreign key to dim_sales_persons."
        tests:
          - not_null
      - name: date_actual
        description: "Business date for KPI actuals and targets."
        tests:
          - not_null
      - name: kpi_progress_status
        description: "Simple status comparing MTD achievement to month progress."

  - name: rpt_sales_order_items_dashboard
    description: "Metabase item-level reporting model. Grain: 1 row = 1 order item enriched with order, customer, sales, and product filter dimensions."
    columns:
      - name: order_item_id
        description: "Primary key — one row per order item."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_order_items')
                field: order_item_id
      - name: order_id
        description: "Foreign key to fct_sales_orders."
        tests:
          - not_null
      - name: product_key
        description: "Product variant key from order item."
      - name: product_type
        description: "Product type for product performance dashboards."
      - name: is_customer_lead_first_order_group
        description: "Inherited from the order. True when the item belongs to the first order group linked to the customer lead."

  - name: rpt_sales_leads_dashboard
    description: "Metabase lead reporting model. Grain: 1 row = 1 lead enriched with sales person and lead source dimensions."
    columns:
      - name: lead_id
        description: "Primary key — one row per CRM lead."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('fct_sales_leads')
                field: lead_id
      - name: lead_source_name
        description: "Lead source display name."
      - name: sales_region_name
        description: "Normalized sales region from lead/sales person context, falling back to Chưa xác định."
      - name: lead_region_name
        description: "Normalized lead region for Metabase filters, falling back to Chưa xác định when source values are null or blank."
      - name: is_converted
        description: "Boolean flag indicating if the lead converted."
        tests:
          - not_null
      - name: preferred_product_count
        description: "Number of preferred products attached to the lead."
      - name: preferred_product_labels
        description: "Distinct preferred product labels aggregated for the lead."

  - name: rpt_sales_leads_order_summary_dashboard
    description: "Metabase lead-level summary model enriched with all linked orders and the first split order group. Grain: 1 row = 1 lead."
    columns:
      - name: lead_id
        description: "Primary key — one row per CRM lead."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_sales_leads_dashboard')
                field: lead_id
      - name: all_order_count
        description: "Total number of orders linked to the lead."
        tests:
          - not_null
      - name: all_order_numbers
        description: "Comma-separated list of all linked order numbers."
      - name: all_order_total_price
        description: "Sum of total_price across all orders linked to the lead."
        tests:
          - not_null
      - name: first_order_group_order_count
        description: "Number of orders inside the lead's first split order group."
        tests:
          - not_null
      - name: first_order_group_order_numbers
        description: "Comma-separated list of order numbers in the lead's first split order group, ordered by order time."
      - name: first_order_group_total_price
        description: "Sum of total_price across all orders in the lead's first split order group."
        tests:
          - not_null
      - name: first_order_id
        description: "Representative first non-null order ID from the first split order group."
      - name: first_order_number
        description: "Representative first non-null order number from the first split order group."
      - name: has_first_order_group
        description: "Boolean flag indicating whether the lead has at least one linked order group."
        tests:
          - not_null

  - name: rpt_sales_lead_preferred_products_dashboard
    description: "Metabase bridge-safe lead x preferred product reporting model. Grain: 1 row = 1 lead x 1 preferred product."
    columns:
      - name: preferred_product_id
        description: "Primary key — unique preferred product row."
        tests:
          - unique
          - not_null
      - name: lead_id
        description: "Foreign key to lead dimension."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_sales_leads_dashboard')
                field: lead_id
      - name: product_type
        description: "Preferred product type ID."
      - name: product_label
        description: "Preferred product label."
      - name: allocated_all_order_total_price
        description: "Lead all-order total_price allocated across preferred products."

  - name: rpt_sales_order_product_categories_dashboard
    description: "Metabase bridge-safe order x product category reporting model. Grain: 1 row = 1 order x 1 product category."
    columns:
      - name: order_product_category_key
        description: "Primary key — order_id:product_category_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_sales_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_sales_orders_dashboard')
                field: order_id
      - name: product_category_id
        description: "ERPNext product category ID."
        tests:
          - not_null
      - name: allocated_total_price
        description: "Order total_price allocated evenly across categories in the order."
      - name: product_category_count
        description: "Number of categories attached to the order."

  - name: rpt_sales_order_purchase_purposes_dashboard
    description: "Metabase bridge-safe order x purchase purpose reporting model. Grain: 1 row = 1 order x 1 purchase purpose."
    columns:
      - name: order_purchase_purpose_key
        description: "Primary key — order_id:purchase_purpose_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to fct_sales_orders."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_sales_orders_dashboard')
                field: order_id
      - name: purchase_purpose_id
        description: "ERPNext purchase purpose ID."
        tests:
          - not_null
      - name: allocated_total_price
        description: "Order total_price allocated evenly across purposes in the order."
      - name: purchase_purpose_count
        description: "Number of purchase purposes attached to the order."

  - name: rpt_sales_attributions_dashboard
    description: "Metabase sales attribution reporting model. Grain: 1 row = 1 order x 1 sales team attribution."
    columns:
      - name: attribution_key
        description: "Primary key — order_id x sales_team_id."
        tests:
          - unique
          - not_null
      - name: order_id
        description: "Foreign key to order fact."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('rpt_sales_orders_dashboard')
                field: order_id
      - name: sales_person_key
        description: "Foreign key to sales person dimension."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sales_persons')
                field: sales_person_id
      - name: allocated_total_price
        description: "Allocated total_price by sales team percentage."
