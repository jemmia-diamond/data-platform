# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: "transformation"
version: "1.0.0"

# This setting configures which "profile" dbt uses for this project.
profile: "transformation"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

on-run-start:
  - "{{ set_statement_timeout() }}"

# Project-level variables (can be overridden via --vars or environment).
vars:
  # E-commerce storefront defaults (marts_ecom). Override when deploying.
  ecom_default_jewelry_discount: 16   # default % off compare_at_price for the no-collection branch
  ecom_website_public_url: ""         # public website base URL (reserved for gia_url construction)

# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  transformation:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +materialized: table
      sales:
        +schema: marts_sales
      marketing:
        +schema: marts_marketing
      finance:
        +schema: marts_finance
      misa:
        +schema: marts_misa
      salesaya:
        +schema: marts_salesaya
      ecom:
        +schema: marts_ecom
      core:
        +schema: marts_core
      tech:
        +schema: marts_tech
      pancake:
        +schema: marts_pancake

